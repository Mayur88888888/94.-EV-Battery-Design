<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Battery Engineering Workbench — v1.4 (P0–P5 + Visuals)</title>
<style>
:root{
  --bg:#f5f6f8; --panel:#fff; --border:#d8dde3; --border-strong:#b8c0c9;
  --text:#1c2530; --text-muted:#5a6673; --text-faint:#8a95a1;
  --accent:#0d5c8f; --accent-hover:#0a4a73; --accent-soft:#e6f0f7;
  --ok:#1e7d3c; --ok-soft:#e6f4ea; --warn:#9a6700; --warn-soft:#fff8e5;
  --err:#b42318; --err-soft:#fdecea;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "SF Mono", Consolas, "Liberation Mono", Menlo, monospace;
  --radius:4px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{font-family:var(--font);font-size:13px;color:var(--text);background:var(--bg);line-height:1.45}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit;color:var(--text)}
input[type=number]{font-family:var(--mono);text-align:right}
input,select,textarea{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:5px 8px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
input.soft-invalid{border-color:#e6c46a;background:#fffdf5}

#app{display:flex;height:100vh;overflow:hidden}
#sidebar{width:250px;flex:0 0 250px;background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
#sidebar .brand{padding:12px 14px;border-bottom:1px solid var(--border);background:linear-gradient(135deg,#0d5c8f,#0a4a73);color:#fff}
#sidebar .brand h1{margin:0;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
#sidebar .brand p{margin:2px 0 0;font-size:10.5px;opacity:.85}
#nav{flex:1;overflow-y:auto;padding:6px 0}
.nav-item{display:flex;align-items:flex-start;gap:8px;padding:7px 14px;cursor:pointer;border-left:3px solid transparent;user-select:none}
.nav-item:hover{background:var(--accent-soft)}
.nav-item.active{background:var(--accent-soft);border-left-color:var(--accent)}
.nav-item .num{font-family:var(--mono);font-size:10px;color:var(--text-faint);min-width:18px;padding-top:2px}
.nav-item .label{flex:1}
.nav-item .title{font-weight:600;font-size:12px}
.nav-item .sub{font-size:10.5px;color:var(--text-muted);margin-top:1px}
.nav-item .status{width:8px;height:8px;border-radius:50%;margin-top:6px;background:#c9d1d9}
.nav-item .status.done{background:var(--ok)}
.nav-item .status.partial{background:#d4a017}
#sidebar .foot{padding:8px 14px;border-top:1px solid var(--border);font-size:10.5px;color:var(--text-faint);display:flex;align-items:center;gap:6px}

#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#topbar{background:#fff;border-bottom:1px solid var(--border);padding:8px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#topbar .crumb{font-size:12px;color:var(--text-muted)}
#topbar .crumb b{color:var(--text)}
#topbar .spacer{flex:1}
#topbar .tag{font-size:10.5px;padding:2px 8px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-weight:600}
#topbar .tag.ev{background:#e6f0f7;color:#0d5c8f}
#topbar .tag.bess{background:#eaf4e9;color:#1e7d3c}

#content{flex:1;overflow-y:auto;padding:16px 20px 40px}
#statusbar{background:#fff;border-top:1px solid var(--border);padding:5px 16px;font-size:11px;color:var(--text-muted);display:flex;gap:14px;align-items:center;min-height:26px}
#statusbar .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:5px}

.view{max-width:1240px;margin:0 auto}
.page-title{margin:0 0 4px;font-size:18px;font-weight:600;display:flex;align-items:center;gap:8px}
.page-sub{margin:0 0 16px;color:var(--text-muted);font-size:12.5px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--text);display:flex;align-items:center;justify-content:space-between;gap:8px}
.grid{display:grid;gap:12px}
.grid.cols-2{grid-template-columns:1fr 1fr}
.grid.cols-3{grid-template-columns:1fr 1fr 1fr}
.grid.cols-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:820px){.grid.cols-2,.grid.cols-3,.grid.cols-4{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;color:var(--text-muted);font-weight:500}

.btn{border:1px solid var(--border-strong);background:#fff;color:var(--text);padding:6px 12px;border-radius:var(--radius);font-size:12px;font-weight:500}
.btn:hover{background:#f0f3f6}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-hover)}
.btn.danger{color:var(--err);border-color:#e0b4b0}
.btn.danger:hover{background:var(--err-soft)}
.btn.sm{padding:3px 8px;font-size:11px}

table{width:100%;border-collapse:collapse;font-size:11.5px}
table th{text-align:left;padding:6px 8px;background:#f0f3f6;border-bottom:1px solid var(--border);font-weight:600;font-size:10.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
table td{padding:5px 8px;border-bottom:1px solid #eef1f4;vertical-align:middle}
table tr:hover td{background:#fafbfc}
table td.num{font-family:var(--mono);text-align:right}
table td input{padding:3px 6px;font-size:11.5px}

.chip{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:600}
.chip.ev{background:#e6f0f7;color:#0d5c8f}
.chip.bess{background:#eaf4e9;color:#1e7d3c}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.err{background:var(--err-soft);color:var(--err)}
.chip.muted{background:#eef1f4;color:var(--text-muted)}

.alert{padding:9px 12px;border-radius:var(--radius);font-size:11.5px;margin-bottom:10px;border:1px solid}
.alert.ok{background:var(--ok-soft);border-color:#b8dcc4;color:#145a2c}
.alert.warn{background:var(--warn-soft);border-color:#f0dca0;color:#7a5200}
.alert.err{background:var(--err-soft);border-color:#f0b8b0;color:#8c1c10}
.alert.info{background:var(--accent-soft);border-color:#b8d0e3;color:#0a4a73}

.eq{background:#f8f9fb;border:1px solid var(--border);border-left:3px solid var(--accent);padding:8px 12px;border-radius:4px;font-family:var(--mono);font-size:11.5px;margin:6px 0;overflow-x:auto;color:#2c3e50}
.eq .lbl{font-family:var(--font);color:var(--text-muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:3px}
.kv{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:12px;margin:6px 0}
.kv .k{color:var(--text-muted)}
.kv .v{font-family:var(--mono);font-weight:600;text-align:right}
.kv .v.ok{color:var(--ok)}.kv .v.err{color:var(--err)}.kv .v.warn{color:var(--warn)}

.empty-state{padding:32px;text-align:center;color:var(--text-muted)}
.empty-state h3{color:var(--text);margin-bottom:6px}

.modal-bg{position:fixed;inset:0;background:rgba(20,30,40,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:6px;max-width:720px;width:100%;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal header h3{margin:0;font-size:14px}
.modal .body{padding:16px;overflow-y:auto}
.modal footer{padding:10px 16px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.modal .x{background:none;border:none;font-size:18px;color:var(--text-muted);cursor:pointer;padding:0 4px}

.proj-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;background:#fff;transition:border-color .12s}
.proj-row:hover{border-color:var(--border-strong);background:#fafbfc}
.proj-row .info{flex:1;min-width:0}
.proj-row .name{font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px}
.proj-row .meta{font-size:11px;color:var(--text-muted);margin-top:2px}
.proj-row .actions{display:flex;gap:6px}

.diag-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eef1f4;font-size:12px}
.diag-row .val{font-family:var(--mono);font-weight:600}

.help-panel{font-size:11.5px;color:var(--text-muted);background:#f8f9fb;border-left:2px solid var(--border-strong);padding:8px 12px;border-radius:0 4px 4px 0;margin-bottom:12px}
.help-panel b{color:var(--text)}

.overflow-x{overflow-x:auto}
.mono{font-family:var(--mono)}
.muted{color:var(--text-muted)}
.small{font-size:11px}
.flex{display:flex;gap:8px;align-items:center}
.flex.wrap{flex-wrap:wrap}
.mt-12{margin-top:12px}

.layout-wrap{display:grid;grid-template-columns:1fr 320px;gap:14px}
@media(max-width:1000px){.layout-wrap{grid-template-columns:1fr}}
.svg-box{background:linear-gradient(135deg,#fafbfc,#f0f3f6);border:1px solid var(--border);border-radius:4px;padding:8px;overflow:auto}
.svg-box svg{display:block;margin:0 auto}
.chart-box{background:#fff;border:1px solid var(--border);border-radius:4px;padding:10px}

/* Dashboard hero with SVG illustration */
.hero{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:center;padding:20px;border-radius:6px;background:linear-gradient(135deg,#0d5c8f 0%,#0a4a73 100%);color:#fff;margin-bottom:14px}
@media(max-width:820px){.hero{grid-template-columns:1fr}}
.hero h2{margin:0 0 6px;font-size:20px;font-weight:600}
.hero p{margin:0 0 12px;font-size:12.5px;opacity:.9}
.hero .hero-actions{display:flex;gap:8px;flex-wrap:wrap}
.hero .hero-actions button{background:#fff;color:#0d5c8f;border:none;padding:8px 14px;border-radius:4px;font-weight:600;font-size:12px}
.hero .hero-actions button.ghost{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3)}
.hero svg{display:block;margin:0 auto}

/* Dashboard stats row */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
@media(max-width:820px){.stats-row{grid-template-columns:1fr 1fr}}
.stat-tile{background:#fff;border:1px solid var(--border);border-radius:6px;padding:14px;display:flex;gap:12px;align-items:center}
.stat-tile .icon{width:40px;height:40px;border-radius:8px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;color:var(--accent);flex-shrink:0}
.stat-tile .info{flex:1;min-width:0}
.stat-tile .num{font-size:20px;font-weight:600;font-family:var(--mono);line-height:1}
.stat-tile .lbl{font-size:10.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;margin-top:2px}

/* Pack 3D isometric */
.iso-wrap{background:linear-gradient(135deg,#fafbfc,#eef1f4);border:1px solid var(--border);border-radius:4px;padding:16px;text-align:center;overflow:hidden}
.iso-wrap svg{max-width:100%;height:auto}

.bom-tree{font-family:var(--mono);font-size:11.5px}
.bom-tree .row{display:grid;grid-template-columns:60px 1fr 80px 80px 80px 100px;gap:8px;padding:4px 0;border-bottom:1px solid #eef1f4;align-items:center}
.bom-tree .row.head{font-family:var(--font);font-weight:600;color:var(--text-muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;background:#f0f3f6;padding:6px 8px;border-radius:3px}
.bom-tree .row.lvl1{padding-left:0}
.bom-tree .row.lvl2{padding-left:20px;background:#fafbfc}
.bom-tree .row.total{font-weight:700;background:var(--accent-soft);padding:8px;border-radius:3px;margin-top:6px}

.run-row{display:flex;gap:12px;align-items:center;padding:8px 10px;border:1px solid var(--border);border-radius:4px;margin-bottom:6px;background:#fff;font-size:11.5px}
.run-row:hover{border-color:var(--border-strong)}
.run-row .when{font-family:var(--mono);color:var(--text-muted);min-width:130px}
.run-row .what{flex:1}
.run-row .result{font-family:var(--mono);font-weight:600}

.step-row{display:grid;grid-template-columns:30px 1fr 180px 100px;gap:8px;padding:6px 8px;border-bottom:1px solid #eef1f4;font-size:11.5px;align-items:center}
.step-row.head{background:#f0f3f6;font-weight:600;color:var(--text-muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.03em}

.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.compare-grid .rev-card{background:#fafbfc;border:1px solid var(--border);border-radius:4px;padding:10px;font-size:11.5px}
.compare-grid .rev-card h4{margin:0 0 6px;font-size:12px;color:var(--accent)}
.diff-row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed #eef1f4}
.diff-row .k{color:var(--text-muted)}
.diff-row .v{font-family:var(--mono);font-weight:600}
.diff-row .v.changed{color:var(--accent)}

/* Gauge */
.gauge-wrap{display:flex;flex-direction:column;align-items:center}
.gauge-value{font-family:var(--mono);font-weight:700;font-size:16px}

/* Overview visual card */
.overview-card{background:#fff;border:1px solid var(--border);border-radius:6px;padding:16px;margin-bottom:14px}
.overview-card h3{margin:0 0 12px;font-size:13px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.overview-visual{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:1000px){.overview-visual{grid-template-columns:1fr}}
.visual-tile{background:#fafbfc;border:1px solid var(--border);border-radius:4px;padding:12px}

/* Heatmap cells */
.heat-cell{transition:all .12s}

/* Icon helper */
.icon{display:inline-block;vertical-align:middle;flex-shrink:0}
</style>
</head>

  <aside id="sidebar">
    <div class="brand">
      <h1>

</div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>

/* ============ Sizing ============ */
function getActiveCell(p) {
  if (!p) return null;
  for (var i = 0; i < State.library.cells.length; i++) if (State.library.cells[i].id === p.cellSelection.cellId) return State.library.cells[i];
  return null;
}
function getSizing(p) {
  var cell = getActiveCell(p);
  if (!cell) return null;
  var a = p.architecture;
  var targetEnergyKWh = a.energyTargetOverride;
  if (targetEnergyKWh == null) targetEnergyKWh = (p.kind === 'EV') ? ((+a.targetRange || 0) * (+a.energyPerKm || 0) / 1000) : (+a.bessEnergy || 0);
  var targetVoltage = a.targetPackVoltage;
  if (targetVoltage == null) targetVoltage = p.kind === 'EV' ? 400 : (+a.bessVoltageNominal || 800);
  var cellEnergyWh = cell.vNom * cell.capacity;
  var Ns = p.electrical.ns || Math.max(1, Math.round(targetVoltage / cell.vNom));
  var Np = p.electrical.np || Math.max(1, Math.ceil((targetEnergyKWh * 1000) / (Ns * cellEnergyWh)));
  return {
    cell: cell, targetEnergyKWh: targetEnergyKWh, targetVoltage: targetVoltage,
    Ns: Ns, Np: Np, total: Ns * Np,
    packNominalV: Ns * cell.vNom, packMinV: Ns * cell.vMin, packMaxV: Ns * cell.vMax,
    packEnergyKWh: Ns * Np * cellEnergyWh / 1000, packCapacityAh: Np * cell.capacity,
    packMass_kg: Ns * Np * cell.mass
  };
}

/* ============ Status ============ */
function deriveArchitectureStatus(p) {
  if (!p) return 'empty';
  var a = p.architecture;
  if (p.kind === 'EV') return (a.targetRange > 0 && a.energyPerKm > 0 && a.curbMass > 0) ? 'done' : 'partial';
  return (a.bessEnergy > 0 && a.bessPower > 0 && a.bessVoltageNominal > 0) ? 'done' : 'partial';
}
function deriveCellsStatus(p) { return getActiveCell(p) ? 'done' : 'partial'; }
function deriveElectricalStatus(p) { return getSizing(p) ? 'done' : 'partial'; }
function deriveLayoutStatus(p) { return getSizing(p) ? 'done' : 'empty'; }
function deriveMechanicalStatus(p) { return (p.mechanical.tray.enabled && p.mechanical.cover.enabled) ? 'done' : 'partial'; }
function deriveThermalStatus(p) { return (p.thermal.duration_s > 0 && p.thermal.dutyCRate > 0) ? 'done' : 'partial'; }
function deriveCoolantStatus(p) { return (p.coolant.segments.length > 0) ? 'done' : 'partial'; }
function deriveBMSStatus(p) { return (p.bms.voltageChannels > 0 && p.bms.tempChannels > 0) ? 'done' : 'partial'; }
function deriveSimStatus(p) { return (p.simulation.runs.length > 0) ? 'done' : 'partial'; }
function deriveTestingStatus(p) { return (p.testing.tests.length > 0) ? 'done' : 'partial'; }
function deriveBOMStatus(p) { return getSizing(p) ? 'done' : 'partial'; }
function deriveMfgStatus(p) { return (p.manufacturing.steps.length > 0) ? 'done' : 'partial'; }
function viewStatus(viewId) {
  var p = getProject();
  if (viewId === 'dashboard' || viewId === 'diagnostics' || viewId === 'reports') return 'done';
  if (!p) return 'empty';
  if (viewId === 'architecture') return deriveArchitectureStatus(p);
  if (viewId === 'cells') return deriveCellsStatus(p);
  if (viewId === 'electrical') return deriveElectricalStatus(p);
  if (viewId === 'layout') return deriveLayoutStatus(p);
  if (viewId === 'enclosure' || viewId === 'joining') return deriveMechanicalStatus(p);
  if (viewId === 'thermal') return deriveThermalStatus(p);
  if (viewId === 'coolant') return deriveCoolantStatus(p);
  if (viewId === 'bms') return deriveBMSStatus(p);
  if (viewId === 'simulation') return deriveSimStatus(p);
  if (viewId === 'testing') return deriveTestingStatus(p);
  if (viewId === 'bom') return deriveBOMStatus(p);
  if (viewId === 'manufacturing') return deriveMfgStatus(p);
  return 'empty';
}

var toastTimer = null;
function toast(text, type) {
  type = type || 'info';
  var existing = $('#toast');
  if (existing) existing.remove();
  var bg = type === 'err' ? '#b42318' : type === 'ok' ? '#1e7d3c' : type === 'warn' ? '#9a6700' : '#1c2530';
  var t = el('div', {id:'toast', style:'position:fixed;bottom:36px;left:50%;transform:translateX(-50%);background:' + bg + ';color:#fff;padding:8px 16px;border-radius:4px;font-size:12px;z-index:200;box-shadow:0 4px 20px rgba(0,0,0,.2);max-width:80vw;text-align:center'}, text);
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { t.remove(); }, 3200);
}

function navigate(viewId) { State.currentView = viewId; render(); }
function render() {
  try {
    renderNav(); renderTopbar(); renderView(); renderStatusbar();
  } catch (e) {
    console.error('Render error:', e);
    var c = $('#content');
    if (c) {
      c.innerHTML = '';
      c.appendChild(el('div', {class:'alert err', style:'margin:20px'},
        el('b', {}, 'Rendering error: '), String(e && e.message || e),
        el('div', {class:'small muted', style:'margin-top:6px'}, 'Open dev tools console for details. Project data is preserved.')));
    }
  }
}

function renderView() {
  var c = $('#content');
  if (!c) return;
  c.innerHTML = '';
  var view = State.currentView;
  if (view === 'dashboard') return renderDashboard(c);
  if (view === 'diagnostics') return renderDiagnostics(c);
  if (view === 'reports') return renderReports(c);
  if (!getProject()) {
    c.appendChild(el('div', {class:'empty-state'},
      el('h3', {}, 'No project open'),
      el('p', {}, 'Create or open a project from the Dashboard.'),
      el('button', {class:'btn primary', onclick: function() { navigate('dashboard'); }}, 'Go to Dashboard')));
    return;
  }
  if (view === 'architecture') return renderArchitecture(c);
  if (view === 'cells') return renderCells(c);
  if (view === 'electrical') return renderElectrical(c);
  if (view === 'layout') return renderLayout(c);
  if (view === 'enclosure') return renderEnclosure(c);
  if (view === 'joining') return renderJoining(c);
  if (view === 'thermal') return renderThermal(c);
  if (view === 'coolant') return renderCoolant(c);
  if (view === 'bms') return renderBMS(c);
  if (view === 'simulation') return renderSimulation(c);
  if (view === 'testing') return renderTesting(c);

}

function download(filename, content, mime) {
  mime = mime || 'application/json';
  var blob = new Blob([content], {type: mime});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(function() { URL.revokeObjectURL(url); a.remove(); }, 0);
}

function importProject() {
  pickFile('.json', function(file) {
    var reader = new FileReader();
    reader.onload = function(ev) {
      try {
        var p = JSON.parse(ev.target.result);
        if (!p.id || !p.kind || !p.architecture) throw new Error('Invalid project file');
        p.id = uid(); p.name = (p.name || 'Imported') + ' (imported)'; p.revision = 0;
        State.projects[p.id] = p; State.currentProjectId = p.id;
        saveProjects(State.projects); navigate('architecture');
        toast('Imported', 'ok');
      } catch(e) { toast('Import failed: ' + e.message, 'err'); }
    };
    reader.readAsText(file);
  });
}
function exportLibrary() { download('bew_library.json', JSON.stringify(State.library, null, 2)); toast('Library exported', 'ok'); }
function importLibrary() {
  pickFile('.json', function(file) {
    var reader = new FileReader();
    reader.onload = function(ev) {
      try {
        var lib = JSON.parse(ev.target.result);
        if (!lib.cells || !Array.isArray(lib.cells)) throw new Error('Invalid library');
        var byId = {};
        for (var i = 0; i < State.library.cells.length; i++) byId[State.library.cells[i].id] = State.library.cells[i];
        for (var j = 0; j < lib.cells.length; j++) byId[lib.cells[j].id] = lib.cells[j];
        var out = [];
        for (var id in byId) if (Object.prototype.hasOwnProperty.call(byId, id)) out.push(byId[id]);
        State.library.cells = out; saveLibrary(State.library);
        toast('Library imported', 'ok'); render();
      } catch(e) { toast('Library import failed: ' + e.message, 'err'); }
    };
    reader.readAsText(file);
  });
}

function buildHeatmapSVG(r) {
  var cols = Math.min(r.s.Np, 8);
  var rows = Math.ceil(r.s.Np / cols);

  var W = cols * (cellW + gap) + 20;
  var H = rows * (cellH + gap) + 50;
  var g = svg('svg', {width: W, height: H, viewBox: '0 0 ' + W + ' ' + H});
  // Color scale: interpolate from cool (blue) to hot (red)
  function heatColor(t01) {

    var g1 = Math.round(150 - t01 * 130);
    var b1 = Math.round(200 - t01 * 180);

  }
  var tMin = r.T.inletTemp;
  var tMax = Math.max(r.cell.tempMax, r.peakTemp);
  for (var i = 0; i < r.s.Np; i++) {
    var ci = i % cols;
    var ri = Math.floor(i / cols);
    var x = 10 + ci * (cellW + gap);
    var y = 30 + ri * (cellH + gap);
    // Simulate module-average temperature with slight variation
    var modTemp = r.T.inletTemp + (r.peakTemp - r.T.inletTemp) * (1 - ci / cols * 0.3);
    var t01 = (modTemp - tMin) / Math.max(tMax - tMin, 1);
    g.appendChild(svg('rect', {x: x, y: y, width: cellW, height: cellH, rx: 4, fill: heatColor(t01), stroke: '#fff', 'stroke-width': 2}));
    g.appendChild(svgText(x + cellW / 2, y + cellH / 2 + 3, 'M' + (i + 1), {size:'10', anchor:'middle', color:'#fff', weight:'600'}));
    g.appendChild(svgText(x + cellW / 2, y + cellH - 4, modTemp.toFixed(0) + '°', {size:'8', anchor:'middle', color:'#fff', mono:true}));
  }
  // Legend
  var legY = H - 12;
  var lx = 10;
  for (var s1 = 0; s1 < 20; s1++) {
    g.appendChild(svg('rect', {x: lx + s1 * 8, y: legY - 6, width: 8, height: 8, fill: heatColor(s1 / 19)}));
  }
  g.appendChild(svgText(lx, legY - 10, 'Cool', {size:'9'}));
  g.appendChild(svgText(lx + 160, legY - 10, 'Hot', {size:'9'}));
  return g;
}

function coolantProps(c) {
  if (c === 'Water') return { rho: 998, mu: 0.001 };
  if (c === 'Water-Glycol 50/50') return { rho: 1050, mu: 0.0025 };
  if (c === 'Air') return { rho: 1.2, mu: 1.8e-5 };
  return { rho: 1050, mu: 0.0025 };
}
function solveHydraulic(c) {
  var p = coolantProps(c.coolant);
  var Q = (c.pump.designFlow_Lpm || 0) / 60000;
  var dP = 0;
  var Qeach = c.segments.length ? Q / Math.sqrt(c.segments.length) : 0;
  for (var i = 0; i < c.segments.length; i++) {
    var seg = c.segments[i];
    var D = seg.diameter_mm / 1000;
    var A = Math.PI * D * D / 4;
    var v = Qeach / A;
    var Re = p.rho * v * D / p.mu;
    var f = Re < 2300 ? 64 / Math.max(Re, 1) : 0.316 * Math.pow(Re, -0.25);
    dP += f * (seg.length_m / D) * p.rho * v * v / 2 + seg.minorLossK * p.rho * v * v / 2;

  return { Q_Lpm: c.pump.designFlow_Lpm, dP_kPa: dP / 1000, dP_m: dP / (p.rho * 9.81), power_W: dP * Q / 0.5, rho: p.rho, mu: p.mu };

function runElectricalSim(p) {
  var s = getSizing(p); if (!s) return null;
  var sim = p.simulation;
  var cell = s.cell;
  var dt = sim.timeStep_s;
  var steps = Math.max(1, Math.round(sim.duration_s / dt));
  var packR = cell.ir * s.Ns / s.Np / 1000;
  var soc = sim.initialSOC;
  var socs = [], voltages = [], currents = [], heats = [], times = [];
  var vLast = s.packNominalV;
  for (var i = 0; i < steps; i++) {
    var current = (sim.loadValue * 1000) / Math.max(vLast, 1);
    var v = s.packNominalV - current * packR;
    vLast = v;
    var dE = sim.loadValue * 1000 * (dt / 3600);
    var dSOC = dE / (s.packEnergyKWh * 1000);
    soc -= dSOC;
    if (soc < 0) soc = 0;
    var cellI = current / s.Np;
    var hpc = cellI * cellI * (cell.ir / 1000);
    socs.push(soc); voltages.push(v); currents.push(current); heats.push(hpc * s.total); times.push(i * dt);
    if (soc <= 0) break;
  }
  return { s: s, cell: cell, sim: sim, dt: dt, socs: socs, voltages: voltages, currents: currents, heats: heats, times: times };
}

    g.appendChild(svgText(padL - 4, yy + 3, (100 - i * 25) + '%', {size:'9', anchor:'end', mono:true}));
  }
  var n = run.socs.length;

  }
  // SOC line
  g.appendChild(svg('polyline', {points: socPts.join(' '), fill: 'none', stroke: '#0d5c8f', 'stroke-width': 2.5}));
  // Voltage line
  g.appendChild(svg('polyline', {points: vPts.join(' '), fill: 'none', stroke: '#9a6700', 'stroke-width': 1.5, 'stroke-dasharray': '4 3'}));
  // Legend
  g.appendChild(svg('line', {x1: padL + 8, x2: padL + 30, y1: 12, y2: 12, stroke: '#0d5c8f', 'stroke-width': 2.5}));
  g.appendChild(svgText(padL + 36, 15, 'SOC (%)', {size:'10'}));
  g.appendChild(svg('line', {x1: padL + 110, x2: padL + 132, y1: 12, y2: 12, stroke: '#9a6700', 'stroke-width': 1.5, 'stroke-dasharray': '4 3'}));
  g.appendChild(svgText(padL + 138, 15, 'Voltage (V)', {size:'10'}));
  // Axis labels
  g.appendChild(svgText(W / 2, H - 6, 'time (s)', {size:'10', anchor:'middle', mono:true}));
  return g;
}

function buildGauge(pct, label) {

  var filled = (pct / 100) * arcLength;
  // Background
  g.appendChild(svg('path', {
    d: 'M ' + (cx - r) + ' ' + cy + ' A ' + r + ' ' + r + ' 0 0 1 ' + (cx + r) + ' ' + cy,
    fill: 'none', stroke: '#eef1f4', 'stroke-width': 14
  }));
  // Filled

function computeBOM(p) {
  var s = getSizing(p); if (!s) return null;
  var L = computeLayout(p);
  var m = p.mechanical;
  var lines = [];
  function add(lvl, part, spec, qty, unitCost, massEach, cat) {
    lines.push({ lvl: lvl, part: part, spec: spec, qty: qty, unitCost: unitCost, massEach: massEach, cat: cat, total: qty * unitCost, mass: qty * massEach });
  }
  add(1, 'Pack assembly', p.kind + ' · ' + s.Ns + 'S ' + s.Np + 'P', 1, 0, 0, 'assembly');
  add(2, 'Cells', s.cell.name, s.total, s.cell.cost || 0, s.cell.mass, 'cell');
  add(2, 'Busbars', p.electrical.busbarMaterial, Math.max(0, s.total - s.Np), 0.5, 0.02, 'electrical');
  add(2, 'Fasteners (main)', m.fasteners.mainBolt, m.fasteners.mainQty, 1.2, 0.02, 'mechanical');
  add(2, 'Fasteners (module)', m.fasteners.moduleBolt, m.fasteners.moduleQty == null ? Math.ceil(s.total / 8) : m.fasteners.moduleQty, 0.45, 0.01, 'mechanical');
  if (m.tray.enabled) add(2, 'Tray', m.tray.material + ' ' + m.tray.thickness + 'mm', 1, 45, estTrayMass(m, L.packW, L.packH), 'enclosure');
  if (m.cover.enabled) add(2, 'Top cover', m.cover.type + ' ' + m.cover.thickness + 'mm', 1, 65, estCoverMass(m, L.packW, L.packH), 'enclosure');
  if (m.insulation.enabled) add(2, 'Mica sheet', m.insulation.type, 1, 12, 0.5, 'insulation');
  if (m.cooling.enabled) add(2, 'Cold plate', m.cooling.plateMaterial, 1, 90, 2.5, 'thermal');
  add(2, 'Seal', m.seal.type, m.seal.length_m, 8, 0.02, 'sealing');
  add(2, 'BMS', m.bms.type, 1, m.bms.cost, m.bms.mass_kg, 'bms');
  add(2, 'Contactor', 'Main + precharge', m.contactor.mainQty + m.contactor.prechargeQty, m.contactor.cost, m.contactor.mass_kg, 'electrical');
  add(2, 'Service disconnect', 'MSD', m.serviceDisconnect.qty, m.serviceDisconnect.cost, m.serviceDisconnect.mass_kg, 'electrical');
  add(2, 'HV connectors', m.connectors.type, m.connectors.qty, m.connectors.cost, m.connectors.mass_kg, 'electrical');
  add(2, 'Harness', 'cable', m.harness.totalLength_m, 3, m.harness.cableMass_per_m, 'harness');
  var materialTotal = 0, cellCost = 0, totalMass = 0;
  lines.forEach(function(l) {
    if (l.lvl === 2) materialTotal += l.total;
    if (l.cat === 'cell') cellCost += l.total;
    totalMass += l.mass;
  });
  var b = p.bom.costBasis;
  var laborCost = (s.total * 0.1) * b.laborRate_USD_hr;
  var scrap = (materialTotal + laborCost) * (b.scrapPercent / 100);
  var overhead = (materialTotal + laborCost) * (b.overheadPercent / 100);
  return { lines: lines, s: s, layout: L, materialTotal: materialTotal, cellCost: cellCost, totalMass: totalMass,
    laborCost: laborCost, scrap: scrap, overhead: overhead, totalCost: materialTotal + laborCost + scrap + overhead, basis: b };
}

      el('button', {class:'btn', onclick: function() { exportHTMLReport(p); }}, 'Export HTML report'),
      el('button', {class:'btn', onclick: function() { exportProject(); }}, 'Export project JSON'),
      el('button', {class:'btn', onclick: function() { if (bom) exportBOMCSV(bom, p); }}, 'Export BOM CSV'))));
  root.appendChild(wrap);
}
function compareRevisions(p, snap) {
  var cur = { electrical: p.electrical, layout: p.layout, cellSelection: p.cellSelection, bms: p.bms };
  var old = snap.snapshot;
  var rows = [
    ['Cell ID', old.cellSelection ? old.cellSelection.cellId : null, cur.cellSelection ? cur.cellSelection.cellId : null],
    ['N_s override', old.electrical ? old.electrical.ns : null, cur.electrical ? cur.electrical.ns : null],
    ['N_p override', old.electrical ? old.electrical.np : null, cur.electrical ? cur.electrical.np : null],
    ['Cell spacing', old.layout ? old.layout.cellSpacing_mm : null, cur.layout ? cur.layout.cellSpacing_mm : null],
    ['Cells/row', old.layout ? old.layout.moduleCellsPerRow : null, cur.layout ? cur.layout.moduleCellsPerRow : null],
    ['Modules/row', old.layout ? old.layout.modulesPerRow : null, cur.layout ? cur.layout.modulesPerRow : null],
    ['Layers', old.layout ? old.layout.layers : null, cur.layout ? cur.layout.layers : null],
    ['BMS arch', old.bms ? old.bms.architecture : null, cur.bms ? cur.bms.architecture : null],
    ['V channels', old.bms ? old.bms.voltageChannels : null, cur.bms ? cur.bms.voltageChannels : null],
    ['Pack OV', old.bms ? old.bms.packOvervoltage : null, cur.bms ? cur.bms.packOvervoltage : null]
  ];
  var grid = el('div', {class:'compare-grid'});
  var left = el('div', {class:'rev-card'}, el('h4', {}, 'Revision ' + snap.revision));
  var right = el('div', {class:'rev-card'}, el('h4', {}, 'Current rev ' + p.revision));
  rows.forEach(function(row) {
    var label = row[0], oldV = row[1], curV = row[2];
    left.appendChild(el('div', {class:'diff-row'}, el('span', {class:'k'}, label), el('span', {class:'v'}, String(oldV == null ? '—' : oldV))));
    var changed = String(oldV == null ? '' : oldV) !== String(curV == null ? '' : curV);
    right.appendChild(el('div', {class:'diff-row'}, el('span', {class:'k'}, label), el('span', {class:'v' + (changed ? ' changed' : '')}, String(curV == null ? '—' : curV))));
  });
  grid.appendChild(left); grid.appendChild(right);
  openModal('Compare revisions', grid, [{ label: 'Close', class: 'btn primary' }]);
}
function exportHTMLReport(p) {
  var s = getSizing(p), bom = computeBOM(p);
  var rows = [];
  if (s) {
    rows.push('<tr><td>Configuration</td><td>' + s.Ns + 'S ' + s.Np + 'P</td></tr>');
    rows.push('<tr><td>Total cells</td><td>' + s.total + '</td></tr>');
    rows.push('<tr><td>Pack nominal voltage</td><td>' + s.packNominalV.toFixed(1) + ' V</td></tr>');
    rows.push('<tr><td>Pack energy</td><td>' + s.packEnergyKWh.toFixed(2) + ' kWh</td></tr>');
    rows.push('<tr><td>Cell-only mass</td><td>' + s.packMass_kg.toFixed(2) + ' kg</td></tr>');
  }
  if (bom) {
    rows.push('<tr><td>Estimated BOM cost</td><td>$' + bom.totalCost.toFixed(2) + '</td></tr>');
    rows.push('<tr><td>Total mass incl. enclosure</td><td>' + bom.totalMass.toFixed(2) + ' kg</td></tr>');
  }
  var moduleItems = NAV.filter(function(n) { return n.id !== 'dashboard' && n.id !== 'diagnostics'; }).map(function(n) {
    return '<li><b>' + n.title + '</b>: ' + viewStatus(n.id) + '</li>';
  }).join('');
  var testHtml = p.testing.standard
    ? '<p>Standard: <b>' + p.testing.standard + '</b></p><ul>' + p.testing.tests.map(function(t) { return '<li>' + t.name + ' — ' + t.status + '</li>'; }).join('') + '</ul>'
    : '<p>No primary standard selected.</p>';
  var html = '<!DOCTYPE html><html><head><meta charset="utf-8"><title>' + p.name + ' — Report</title>'
    + '<style>body{font-family:system-ui,sans-serif;max-width:800px;margin:24px auto;padding:0 16px;color:#1c2530}'
    + 'h1{font-size:20px;border-bottom:2px solid #0d5c8f;padding-bottom:6px}'
    + 'h2{font-size:14px;margin-top:20px;color:#0d5c8f}'
    + 'table{border-collapse:collapse;width:100%;margin:8px 0}'
    + 'td{border:1px solid #d8dde3;padding:5px 8px;font-size:12px}'
    + 'tr td:first-child{background:#f0f3f6;width:40%}'
    + '.foot{margin-top:24px;font-size:10px;color:#5a6673}</style></head>'
    + '<body><h1>' + p.name + ' — Battery Pack Report</h1>'
    + '<p><b>Kind:</b> ' + p.kind + ' &nbsp; <b>Revision:</b> ' + p.revision + ' &nbsp; <b>Date:</b> ' + new Date().toLocaleString() + '</p>'
    + '<h2>Key numbers</h2><table>' + rows.join('') + '</table>'
    + '<h2>Modules</h2><ul>' + moduleItems + '</ul>'
    + '<h2>Test plan</h2>' + testHtml
    + '<h2>Disclaimer</h2><p>Generated from project data at export time. Reduced-order models. Not a certification.</p>'
    + '<div class="foot">Battery Engineering Workbench v1.4</div></body></html>';
  download(p.name.replace(/[^\w-]+/g, '_') + '_report.html', html, 'text/html');
  toast('Report exported', 'ok');
}

/* ============ Diagnostics ============ */
function renderDiagnostics(root) {
  var wrap = el('div', {class:'view'});
  wrap.appendChild(el('h2', {class:'page-title'}, 'Diagnostics'));
  wrap.appendChild(el('p', {class:'page-sub'}, 'Storage, browser support, data recovery.'));
  var card = el('div', {class:'card'}, el('h3', {}, 'Environment'));
  var rows = [
    ['LocalStorage', hasLS() ? 'available' : 'unavailable'],
    ['IndexedDB', hasIDB() ? 'available' : 'unavailable'],
    ['WebGL', hasWebGL() ? 'available' : 'unavailable'],
    ['localStorage used', estimateStorage()],
    ['Projects', Object.keys(State.projects).length],
    ['Cells', State.library.cells.length]
  ];
  rows.forEach(function(r) { card.appendChild(el('div', {class:'diag-row'}, el('span', {}, r[0]), el('span', {class:'val'}, String(r[1])))); });
  wrap.appendChild(card);
  wrap.appendChild(el('div', {class:'card'}, el('h3', {}, 'Data'),
    el('div', {class:'flex wrap'},
      el('button', {class:'btn', onclick: function() { download('bew_projects_backup.json', JSON.stringify(State.projects, null, 2)); }}, 'Export all projects'),
      el('button', {class:'btn', onclick: function() { download('bew_library_backup.json', JSON.stringify(State.library, null, 2)); }}, 'Export library'),
      el('button', {class:'btn danger', onclick: function() {
        if (!confirm('Clear ALL local data?')) return;
        try { localStorage.removeItem(DB_KEY); localStorage.removeItem(LIB_KEY); localStorage.removeItem(APP_KEY); } catch(e){}
        location.reload();
      }}, 'Clear local data'))));
  root.appendChild(wrap);
}
function hasLS() { try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); return true; } catch (e) { return false; } }
function hasIDB() { return !!window.indexedDB; }
function hasWebGL() { try { var c = document.createElement('canvas'); return !!(c.getContext('webgl') || c.getContext('experimental-webgl')); } catch (e) { return false; } }
function estimateStorage() {
  try { var t = 0; for (var k in localStorage) if (Object.prototype.hasOwnProperty.call(localStorage, k)) t += (localStorage.getItem(k) || '').length * 2; return (t / 1024).toFixed(1) + ' KB'; }
  catch (e) { return 'unknown'; }
}

/* ============ Modal ============ */
function openModal(title, bodyEl, buttons) {
  var m = $('#modal'); if (!m) return;
  m.innerHTML = '';
  m.appendChild(el('header', {}, el('h3', {}, title), el('button', {class:'x', onclick: closeModal}, '×')));
  m.appendChild(el('div', {class:'body'}, bodyEl));
  var footer = el('footer', {});
  (buttons || []).forEach(function(b) {
    footer.appendChild(el('button', {class: b.class || 'btn', onclick: function() { if (b.onclick) b.onclick(); else closeModal(); }}, b.label));
  });
  m.appendChild(footer);
  var bg = $('#modalBg'); if (bg) bg.classList.add('show');
}
function closeModal() { var bg = $('#modalBg'); if (bg) bg.classList.remove('show'); }

/* ============ Boot ============ */
function boot() {
  var bg = $('#modalBg');
  if (bg) bg.addEventListener('click', function(e) { if (e.target.id === 'modalBg') closeModal(); });
  if (State.app.lastProjectId && State.projects[State.app.lastProjectId]) {
    State.currentProjectId = State.app.lastProjectId;
    State.currentView = 'architecture';
  }
  render();
  setInterval(function() { State.app.lastProjectId = State.currentProjectId; saveApp(State.app); }, 3000);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
</body>
</html>
